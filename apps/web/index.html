<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Supernote</title>
    <meta name="description" content="Système de connaissance + CRM personnel local-first" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7c3aed" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Pre-paint theme: read the persisted next-themes value before React
         mounts so we don't flash the wrong palette. Mirrors what next-themes
         does via the (now removed) suppressHydrationWarning + script. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("supernote-theme");
          var theme = stored || "light";
          if (theme === "system") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
            document.documentElement.setAttribute("data-theme", "dark");
          } else {
            document.documentElement.classList.add("light");
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (_e) {
          /* localStorage unavailable — first-paint stays light */
        }

        // Registre visuel (refonte Linear/Raycast vs héritage). Pré-peint au
        // même titre que le thème : les tokens de surface changent, un flash
        // serait une bascule de palette complète. `?ui=` prime pour scripter
        // les captures. Retirer ce bloc = retirer la refonte.
        try {
          var params = new URLSearchParams(window.location.search);
          var fromQuery = params.get("ui");
          if (fromQuery === "next" || fromQuery === "legacy") {
            localStorage.setItem("supernote-ui", fromQuery);
            // Le paramètre est consommé une fois : sinon il survit à chaque
            // rechargement et écrase la bascule faite dans l'app.
            params.delete("ui");
            var qs = params.toString();
            history.replaceState(
              {},
              "",
              window.location.pathname + (qs ? "?" + qs : "") + window.location.hash,
            );
          }
          var ui = localStorage.getItem("supernote-ui");
          document.documentElement.setAttribute(
            "data-ui",
            ui === "legacy" ? "legacy" : "next",
          );
        } catch (_e) {
          document.documentElement.setAttribute("data-ui", "next");
        }
      })();
    </script>
  </head>
  <body class="bg-[var(--surface-0)] text-[var(--text-primary)] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

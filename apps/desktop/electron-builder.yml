appId: fr.numerisk.supernote
productName: Supernote
copyright: Copyright © 2026 Numerisk

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - "!dist/preload/**/*.map"
  - "!dist/main/**/*.map"

# Next.js standalone server bundle (monorepo layout):
# - standalone/  → app/web-server/          (contains apps/web/server.js)
# - .next/static → app/web-server/apps/web/.next/static  (client assets)
extraResources:
  - from: "../../apps/web/.next/standalone-resolved"
    to: "app/web-server"
    filter:
      - "**/*"
      - "**/.*"
      - "**/.*/**"
  - from: "../../apps/web/.next/static"
    to: "app/web-server/apps/web/.next/static"
    filter:
      - "**/*"

# macOS
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.productivity
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  icon: build/icon.icns
  # Code signing — uncomment and fill in when Developer ID certificate is available.
  # identity: "Developer ID Application: <Your Name / Org> (<TeamID>)"
  # notarize: false  # set to true once APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID are configured
  # afterSign: scripts/notarize.js

dmg:
  writeUpdateInfo: false

# Windows
win:
  target:
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  # Skip PE resource editing (sets version/icon via rcedit which needs wine on Linux).
  # The default Electron icon and version strings are used. Safe to disable when cross-compiling.
  signAndEditExecutable: false
  # Code signing — uncomment when a .pfx certificate is available.
  # certificateFile: ${env.WIN_CSC_LINK}          # path or base64 of .pfx
  # certificatePassword: ${env.WIN_CSC_KEY_PASSWORD}
  # signingHashAlgorithms: [sha256]

portable:
  artifactName: "Supernote-${version}-win-${arch}-portable.exe"

# Linux
linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: build/icon.png
  category: Office

publish:
  provider: github
  owner: numerisk
  repo: supernote
  releaseType: release
